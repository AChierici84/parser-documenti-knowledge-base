[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "document-parser-knowledge-base"
version = "0.1.0"
description = "A small command-line knowledge base for indexing documents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["chardet==7.6.0"]

[project.scripts]
document-knowledge-base = "main:cli"

[tool.setuptools]
py-modules = ["main"]
packages = ["model", "parser", "utils"]

[tool.setuptools.package-data]
model = ["default_config.ini"]